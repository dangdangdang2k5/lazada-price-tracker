services:
  - type: web
    name: lazada-price-tracker
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LAZADA_COOKIES_JSON
        sync: false
      - key: PRICE_CHECK_MIN_INTERVAL_SECONDS
        value: "120"
      - key: PRICE_CHECK_MAX_INTERVAL_SECONDS
        value: "180"
